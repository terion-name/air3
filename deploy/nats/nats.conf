# air3 demo NATS server configuration.
#
# This intentionally uses NATS Core only. TLS is required and client
# certificates are verified against the local development CA generated by
# deploy/scripts/certs.sh.

server_name: air3-demo-nats
port: 4222

http: 8222

tls {
  cert_file: "/etc/nats/certs/nats-server.crt"
  key_file: "/etc/nats/certs/nats-server.key"
  ca_file: "/etc/nats/certs/dev-ca.crt"
  verify: true
  timeout: 2
}

authorization {
  users: [
    {
      user: "edge"
      password: "edge-demo-pass"
      permissions: {
        publish: ["air3.tickets"]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      user: "connector"
      password: "connector-demo-pass"
      permissions: {
        subscribe: ["air3.tickets", "_INBOX.>"]
        publish: ["_INBOX.>"]
      }
    }
  ]
}
